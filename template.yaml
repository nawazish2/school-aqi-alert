AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: School AQI Alert - texts school principals when air quality is bad.

Parameters:
  AlertThreshold:
    Type: Number
    Default: 151
    Description: US AQI at or above which an SMS is sent
  OfficerPhone:
    Type: String
    Default: ""
    Description: District officer phone (+91...) that receives escalations
  AdminKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: If set, adding/removing schools, refresh and simulate need this key (x-admin-key header)
  AdviceModelId:
    Type: String
    Default: ""
    Description: Optional Bedrock model id for the Strands advice agent (empty = rule-based advice)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        SCHOOLS_TABLE: !Ref SchoolsTable
        ALERTS_TABLE: !Ref AlertsTable
        ALERT_THRESHOLD: !Ref AlertThreshold
        ADVICE_MODEL_ID: !Ref AdviceModelId
        ADMIN_KEY: !Ref AdminKey

Resources:
  SchoolsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: school_id, AttributeType: S }
      KeySchema:
        - { AttributeName: school_id, KeyType: HASH }

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: ts, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: ts, KeyType: RANGE }

  CheckAqiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: check_aqi.handler
      Environment:
        Variables:
          CONFIRM_BASE_URL: !GetAtt ConfirmFunctionUrl.FunctionUrl
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SchoolsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - Statement:
            - { Effect: Allow, Action: sns:Publish, Resource: "*" }
            - { Effect: Allow, Action: bedrock:InvokeModel, Resource: "*" }
      Events:
        Morning:
          Type: Schedule
          Properties:
            Schedule: cron(0 1 * * ? *) # 06:30 IST every day
            Description: Daily 6:30 AM IST AQI check

  ConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: confirm.handler
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SchoolsTable }

  EscalateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: escalate.handler
      Environment:
        Variables:
          OFFICER_PHONE: !Ref OfficerPhone
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SchoolsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - Statement:
            - { Effect: Allow, Action: sns:Publish, Resource: "*" }
      Events:
        Deadline:
          Type: Schedule
          Properties:
            Schedule: cron(0 2 * * ? *) # 07:30 IST: schools that have not confirmed are escalated
            Description: Escalate unconfirmed alerts

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.handler
      Environment:
        Variables:
          CONFIRM_BASE_URL: !GetAtt ConfirmFunctionUrl.FunctionUrl
          OFFICER_PHONE: !Ref OfficerPhone
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SchoolsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AlertsTable }
        - Statement:
            - { Effect: Allow, Action: sns:Publish, Resource: "*" }
            - { Effect: Allow, Action: bedrock:InvokeModel, Resource: "*" }
      Events:
        Dashboard: { Type: HttpApi, Properties: { Path: /, Method: GET } }
        Schools: { Type: HttpApi, Properties: { Path: /api/schools, Method: GET } }
        AddSchool: { Type: HttpApi, Properties: { Path: /api/schools, Method: POST } }
        DeleteSchool: { Type: HttpApi, Properties: { Path: /api/schools/{school_id}, Method: DELETE } }
        Alerts: { Type: HttpApi, Properties: { Path: /api/alerts, Method: GET } }
        Escalate: { Type: HttpApi, Properties: { Path: /api/escalate, Method: POST } }
        Refresh: { Type: HttpApi, Properties: { Path: /api/refresh, Method: POST } }
        Simulate: { Type: HttpApi, Properties: { Path: /api/simulate, Method: POST } }

Outputs:
  DashboardUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  SchoolsTableName:
    Value: !Ref SchoolsTable
